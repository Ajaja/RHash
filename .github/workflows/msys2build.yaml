name: Build RHash (MSYS2 CLANG64 / UCRT64 / MINGW64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "rhash/RHash branch, tag or commit to build"
        default: "master"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang64
            msystem: CLANG64
            cc: clang
            strip: llvm-strip
            packages: >-
              mingw-w64-clang-x86_64-clang
              mingw-w64-clang-x86_64-llvm
              mingw-w64-clang-x86_64-binutils
          - name: ucrt64
            msystem: UCRT64
            cc: gcc
            strip: strip
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-binutils
          - name: mingw64
            msystem: MINGW64
            cc: gcc
            strip: strip
            packages: >-
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-binutils
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git ${{ matrix.packages }}

      - name: Clone rhash/RHash
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}
          path: RHash

      - name: Patch SHA-NI detection for clang
        if: matrix.cc == 'clang'
        working-directory: RHash
        run: |
          # clang reports __GNUC__=4.2, so HAS_GNUC(6, 3) is false and the CPUID
          # leaf-7 query (which carries the SHA-NI bit) is compiled out. Without
          # it SHA-1/SHA-256 silently fall back to the slow portable C code.
          # (GCC >= 6.3 is not affected, so this is only applied for clang.)
          sed -i -E 's/^(#[[:space:]]*if[[:space:]]+)HAS_GNUC\(6, 3\)[[:space:]]*$/\1(HAS_GNUC(6, 3) || defined(__clang__))/' librhash/byte_order.c
          echo "--- patched region ---"
          grep -n -B1 -A3 'RHASH_CPUIDEX(id, sub_id, regs)' librhash/byte_order.c | head -12
          git diff --stat

      - name: Configure
        working-directory: RHash
        run: |
          ./configure \
            --cc=${{ matrix.cc }} \
            --disable-openssl \
            --disable-gettext \
            --enable-static \
            --disable-lib-shared \
            --extra-cflags="-O3"

      - name: Build
        working-directory: RHash
        run: make -j"$(nproc)" build

      - name: Inspect unstripped binary
        working-directory: RHash
        run: |
          ls -l rhash.exe
          echo "--- DLL dependencies (should be Windows system DLLs only) ---"
          objdump -p rhash.exe | grep "DLL Name"
          if objdump -p rhash.exe | grep -Ei "DLL Name: *(librhash|libwinpthread|libgcc|libstdc|libc\+\+|libunwind|msys-)"; then
            echo "::error::rhash.exe depends on a non-system DLL (not statically linked)"
            exit 1
          fi
          echo "--- run before stripping ---"
          ./rhash.exe --version; echo "exit code: $?"

      - name: Strip and verify
        working-directory: RHash
        run: |
          # clang64: LLVM's strip (GNU strip can corrupt lld-linked PE files)
          # ucrt64/mingw64: GNU strip from binutils
          ${{ matrix.strip }} --strip-all rhash.exe
          ls -l rhash.exe
          echo "--- run after stripping ---"
          ./rhash.exe --version
          echo "--- self-test: SHA-256 of 'abc' (expect ba7816bf...) ---"
          printf 'abc' | ./rhash.exe --sha256 -

      - name: Benchmark
        working-directory: RHash
        run: |
          # Informational only; depends on the runner's CPU.
          # SHA-256: ~300 MBps = portable C code, >1000 MBps = SHA-NI active.
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            ./rhash.exe --benchmark --sha256 | tail -n 1
            ./rhash.exe --benchmark --gost12-256 | tail -n 1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Package
        working-directory: RHash
        run: |
          mkdir -p ../dist
          cp rhash.exe ../dist/
          cp COPYING ../dist/
          cd ../dist
          sha256sum rhash.exe > rhash.exe.sha256
          cat rhash.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhash-win64-${{ matrix.name }}-stripped
          path: dist/
          if-no-files-found: error
