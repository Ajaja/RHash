name: Build RHash (MSYS2 CLANG64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "rhash/RHash branch, tag or commit to build"
        default: "master"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Set up MSYS2 (CLANG64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-binutils
            mingw-w64-clang-x86_64-llvm

      - name: Clone rhash/RHash
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'master' }}
          path: RHash

      - name: Patch SHA-NI detection for clang
        working-directory: RHash
        run: |
          # clang reports __GNUC__=4.2, so HAS_GNUC(6, 3) is false and the CPUID
          # leaf-7 query (which carries the SHA-NI bit) is compiled out. Without
          # it SHA-1/SHA-256 silently fall back to the slow portable C code.
          sed -i -E 's/^(#[[:space:]]*if[[:space:]]+)HAS_GNUC\(6, 3\)[[:space:]]*$/\1(HAS_GNUC(6, 3) || defined(__clang__))/' librhash/byte_order.c
          echo "--- patched region ---"
          grep -n -B1 -A3 'RHASH_CPUIDEX(id, sub_id, regs)' librhash/byte_order.c | head -12
          git diff --stat

      - name: Configure
        working-directory: RHash
        run: |
          ./configure \
            --cc=clang \
            --disable-openssl \
            --disable-gettext \
            --enable-static \
            --disable-lib-shared \
            --extra-cflags="-O3"

      - name: Build
        working-directory: RHash
        run: make -j"$(nproc)" build

      - name: Inspect unstripped binary
        working-directory: RHash
        run: |
          ls -l rhash.exe
          echo "--- DLL dependencies (should be system DLLs only) ---"
          objdump -p rhash.exe | grep "DLL Name"
          if objdump -p rhash.exe | grep -qi "librhash.dll"; then
            echo "::error::rhash.exe still depends on librhash.dll (not statically linked)"
            exit 1
          fi
          echo "--- run before stripping ---"
          ./rhash.exe --version; echo "exit code: $?"

      - name: Strip and verify
        working-directory: RHash
        run: |
          # LLVM's strip handles lld-linked PE files; GNU strip can corrupt them
          if command -v llvm-strip >/dev/null; then
            llvm-strip --strip-all rhash.exe
          else
            strip --strip-all rhash.exe
          fi
          ls -l rhash.exe
          echo "--- run after stripping ---"
          ./rhash.exe --version
          echo "--- self-test: SHA-256 of 'abc' ---"
          printf 'abc' | ./rhash.exe --sha256 -

      - name: Benchmark SHA-256
        working-directory: RHash
        run: |
          # ~300 MBps = portable C code; >1000 MBps = SHA-NI is active.
          # (Informational only: depends on the runner's CPU.)
          ./rhash.exe --benchmark --sha256 || true

      - name: Package
        working-directory: RHash
        run: |
          mkdir -p ../dist
          cp rhash.exe ../dist/
          cp COPYING ../dist/
          cd ../dist
          sha256sum rhash.exe > rhash.exe.sha256
          cat rhash.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhash-win64-clang-stripped
          path: dist/
          if-no-files-found: error
